<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-Хантер — профили класса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E33127;
    --red-dark:#C4241C;
    --orange:#FF8A1E;
    --ink:#191A1D;
    --paper:#F4F2EE;
    --card:#FFFFFF;
    --line:#E6E2DA;
    --line-strong:#D8D3C8;
    --blue:#3E64F4;
    --blue-dark:#2E4FD1;
    --green:#1E9A5A;
    --text:#1C1C1F;
    --text-mid:#5B5C62;
    --text-soft:#8A8B90;
    --chip-bg:#F7F5F1;
    --shadow-hover:0 14px 34px rgba(25,20,10,.10);
    --radius-sm:9px;
    --radius-md:14px;
    --radius-lg:20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:#101113;
      --paper:#15161A;
      --card:#1E2024;
      --line:#2C2E33;
      --line-strong:#3A3C42;
      --text:#EDEDEF;
      --text-mid:#B2B3B8;
      --text-soft:#84858B;
      --chip-bg:#26282D;
      --shadow-hover:0 14px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#101113;
    --paper:#15161A;
    --card:#1E2024;
    --line:#2C2E33;
    --line-strong:#3A3C42;
    --text:#EDEDEF;
    --text-mid:#B2B3B8;
    --text-soft:#84858B;
    --chip-bg:#26282D;
    --shadow-hover:0 14px 34px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;}

  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:var(--ink);
    color:#fff;
  }
  .site-header__inner{
    max-width:1140px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand__mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(155deg,var(--red),var(--orange));
    display:flex;align-items:center;justify-content:center;
  }
  .brand__mark svg{width:18px;height:18px;}
  .brand__name{font-weight:800;font-size:17px;letter-spacing:-0.01em;}
  .brand__name span{color:#B9BBC2;font-weight:600;}

  .toggle{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .toggle input{position:absolute;opacity:0;width:1px;height:1px;}
  .toggle__track{
    width:38px;height:22px;border-radius:99px;background:#3A3C42;
    position:relative;flex:none;transition:background .15s ease;
  }
  .toggle__thumb{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;transition:transform .15s ease;
  }
  .toggle input:checked + .toggle__track{background:var(--red);}
  .toggle input:checked + .toggle__track .toggle__thumb{transform:translateX(16px);}
  .toggle__label{font-size:13.5px;font-weight:600;color:#D7D8DD;}

  /* ---------- hero ---------- */
  .hero{
    background:linear-gradient(120deg,var(--red) 0%, var(--red) 42%, var(--orange) 100%);
    color:#fff;
    padding:56px 0 64px;
  }
  .hero__inner{max-width:680px;}
  .hero h1{
    font-size:clamp(30px,5vw,46px);
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 16px;
    line-height:1.08;
  }
  .hero__sub{
    font-size:clamp(15px,2vw,17.5px);
    color:rgba(255,255,255,.92);
    margin:0 0 26px;
    max-width:52ch;
    line-height:1.55;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    border:none;cursor:pointer;
    font-weight:700;font-size:14.5px;
    padding:13px 22px;border-radius:11px;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn--dark{background:var(--ink);color:#fff;}
  .btn--dark:hover{background:#000;}
  .btn--blue{background:var(--blue);color:#fff;}
  .btn--blue:hover{background:var(--blue-dark);}
  .btn--sm{padding:9px 16px;font-size:13.5px;border-radius:9px;}
  .btn--full{width:100%;justify-content:center;}

  /* ---------- stats ---------- */
  .stats{
    margin-top:-30px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
    position:relative;z-index:2;
  }
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:18px 18px;
    box-shadow:0 8px 20px rgba(25,20,10,.06);
  }
  .stat-card__num{font-size:26px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card__label{font-size:13px;color:var(--text-mid);margin-top:4px;line-height:1.4;font-weight:500;}

  /* ---------- toolbar ---------- */
  .catalog{padding:52px 0 72px;}
  .catalog__head{margin-bottom:22px;}
  .catalog__head h2{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-0.01em;}
  .catalog__head p{margin:0;color:var(--text-mid);font-size:14.5px;}

  .toolbar{
    display:flex;flex-direction:column;gap:14px;
    margin-bottom:26px;
  }
  .search-box{
    position:relative;
  }
  .search-box svg{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--text-soft);
  }
  .search-box input{
    width:100%;padding:13px 16px 13px 42px;
    border:1.5px solid var(--line-strong);border-radius:11px;
    font-size:15px;background:var(--card);color:var(--text);
    font-family:inherit;
  }
  .search-box input:focus{border-color:var(--blue);}
  .pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:1.5px solid var(--line-strong);background:var(--card);color:var(--text-mid);
    padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .pill--active{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---------- grid & cards ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;
  }
  .empty{color:var(--text-mid);font-size:15px;padding:30px 0;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:20px;display:flex;flex-direction:column;gap:13px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-hover);}
  .card__link{flex:1;display:flex;flex-direction:column;gap:13px;text-decoration:none;color:inherit;min-height:0;}
  .card__top{display:flex;gap:13px;}
  .card__avatar{
    width:64px;height:80px;border-radius:9px;object-fit:cover;object-position:top center;
    border:1px solid var(--line);background:#fff;flex:none;
  }
  .card__name{font-weight:700;font-size:16.5px;line-height:1.3;}
  .card__nickname{font-size:12.5px;color:var(--text-soft);margin-top:1px;}
  .card__position{font-size:13.5px;color:var(--text-mid);margin-top:5px;line-height:1.35;}

  .conf{display:flex;align-items:center;gap:9px;}
  .conf-bar{display:flex;gap:3px;flex:none;}
  .conf--sm .conf-seg{width:15px;height:6px;}
  .conf--lg .conf-seg{width:24px;height:8px;}
  .conf-seg{
    background:var(--line-strong);border-radius:3px;overflow:hidden;position:relative;
  }
  .conf-fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:3px;}
  .conf-label{font-size:12.5px;color:var(--text-mid);font-weight:600;}

  .card__chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:12px;padding:5px 10px;border-radius:99px;
    border:1px solid var(--line);background:var(--chip-bg);color:var(--text-mid);font-weight:600;
    white-space:nowrap;
  }
  .card__quote{
    font-size:13.5px;color:var(--text-mid);line-height:1.5;font-style:italic;
    margin:0;flex:1;
  }
  .card__cta{align-self:flex-start;margin-top:2px;}

  /* ---------- profile page ---------- */
  .profile{padding:36px 0 70px;}
  .back{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--text-mid);font-size:14px;font-weight:600;margin-bottom:22px;
  }
  .back svg{width:15px;height:15px;}
  .back:hover{color:var(--text);}

  .profile-hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:30px;display:flex;gap:28px;
  }
  .profile-hero__avatar{
    width:180px;height:225px;border-radius:var(--radius-md);object-fit:cover;object-position:top center;
    border:1px solid var(--line);flex:none;background:#fff;
  }
  .profile-hero__info{flex:1;min-width:0;}
  .profile-hero__info h1{font-size:clamp(24px,3.6vw,32px);margin:0;font-weight:800;letter-spacing:-0.01em;}
  .profile-hero__nickname{font-size:15px;color:var(--text-soft);margin-top:4px;}
  .profile-hero__flavor{font-size:13.5px;color:var(--text-soft);margin-top:6px;line-height:1.5;max-width:52ch;}
  .profile-hero__position{font-size:16px;color:var(--text-mid);margin-top:10px;font-weight:600;}
  .profile-hero__confidence{margin-top:18px;}
  .profile-hero__chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;}

  .name-hidden{
    background:var(--chip-bg);border:1.5px dashed var(--line-strong);color:var(--text-mid);
    padding:5px 12px;border-radius:8px;font-weight:600;font-size:.85em;cursor:pointer;
    font-family:inherit;
  }
  .name-hidden:hover{border-color:var(--red);color:var(--red);}
  .card__name .name-hidden, .card__name button.name-hidden{font-size:14px;}
  .mini-card__name .name-hidden{font-size:12.5px;padding:4px 9px;}

  .section{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);}
  .section h2{
    font-size:15px;font-weight:700;margin:0 0 10px;color:var(--text-mid);
    text-transform:none;
  }
  .section p{font-size:16px;line-height:1.6;margin:0;max-width:70ch;}

  .similar{margin-top:44px;}
  .similar h2{font-size:18px;font-weight:800;margin:0 0 16px;}
  .similar__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mini-card{
    display:flex;gap:12px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .mini-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-hover);}
  .mini-card img{width:46px;height:58px;border-radius:7px;object-fit:cover;object-position:top center;border:1px solid var(--line);flex:none;}
  .mini-card__name{font-weight:700;font-size:14px;}
  .mini-card__position{font-size:12px;color:var(--text-mid);margin-top:2px;line-height:1.3;}

  .not-found{padding:80px 0;text-align:center;}
  .not-found h1{font-size:26px;margin-bottom:10px;}
  .not-found p{color:var(--text-mid);margin-bottom:22px;}

  /* ---------- footer ---------- */
  .site-footer{
    border-top:1px solid var(--line);padding:26px 0;margin-top:20px;
  }
  .site-footer__inner{
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    font-size:13px;color:var(--text-soft);
  }

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr);margin-top:-24px;}
    .similar__grid{grid-template-columns:1fr;}
  }
  @media (max-width:720px){
    .profile-hero{flex-direction:column;padding:22px;}
    .profile-hero__avatar{width:130px;height:163px;}
    .toggle__label{display:none;}
    .brand__name span{display:none;}
    .brand__name{font-size:16px;white-space:nowrap;}
  }
  @media (max-width:480px){
    .stats{grid-template-columns:1fr 1fr;}
    .wrap{padding:0 16px;}
    .card__top{gap:10px;}
  }
</style>
</head>

/* ======================= STATE ======================= */
const state = { query:'', filter:'all', guessMode:false, revealed:new Set() };

try{
  const saved = JSON.parse(localStorage.getItem('ithunter_state') || '{}');
  if (saved.guessMode) state.guessMode = true;
  if (Array.isArray(saved.revealed)) state.revealed = new Set(saved.revealed);
}catch(e){}

function persist(){
  try{
    localStorage.setItem('ithunter_state', JSON.stringify({guessMode:state.guessMode, revealed:[...state.revealed]}));
  }catch(e){}
}

/* ======================= HELPERS ======================= */
function fullName(p){ return p.firstName + ' ' + p.lastName; }

function findBySlug(slug){ return PROFILES.find(p=>p.slug===slug); }

function searchable(p){
  return [p.firstName,p.lastName,p.nickname,p.flavorText,...p.itLikes,...p.learnLikes,
          p.workStyle,...p.platforms,p.aiUse,p.dreamProduct,p.position,p.hobby,p.fact]
    .filter(Boolean).join(' ').toLowerCase();
}

function matchesFilter(p, f){
  switch(f){
    case 'programming': return p.itLikes.includes('Программирование');
    case 'theory': return p.itLikes.includes('Теория');
    case 'digital': return p.itLikes.includes('Цифровые сервисы');
    case 'team': return p.workStyle === 'В команде';
    case 'solo': return p.workStyle === 'Одному';
    case 'tiktok': return p.platforms.includes('TikTok');
    default: return true;
  }
}

function getFilteredProfiles(){
  return PROFILES.filter(p => matchesFilter(p, state.filter) &&
    (!state.query || searchable(p).includes(state.query)));
}

function formatConfidence(v){
  return Number.isInteger(v) ? String(v) : Math.floor(v) + '–' + Math.ceil(v);
}

function renderConfidence(value, size){
  let segs = '';
  for (let i=0;i<5;i++){
    const fill = Math.max(0, Math.min(1, value - i)) * 100;
    segs += '<span class="conf-seg"><span class="conf-fill" style="width:'+fill+'%"></span></span>';
  }
  return '<div class="conf conf--'+size+'"><div class="conf-bar">'+segs+'</div>'+
         '<span class="conf-label">Уверенность в IT: '+formatConfidence(value)+' из 5</span></div>';
}

function chipsRow(list){
  return list.map(t=>'<span class="chip">'+t+'</span>').join('');
}

function nameMarkup(p){
  if (!state.guessMode || state.revealed.has(p.slug)){
    return '<span class="name-text">'+fullName(p)+'</span>';
  }
  return '<button type="button" class="name-hidden" data-reveal="'+p.slug+'">Нажми, чтобы узнать</button>';
}

function pickSimilar(p, n){
  const pool = PROFILES.filter(x=>x.slug!==p.slug);
  const scored = pool.map(o=>{
    let score = 0;
    score += o.itLikes.filter(x=>p.itLikes.includes(x)).length * 2;
    score += o.learnLikes.filter(x=>p.learnLikes.includes(x)).length;
    if (o.workStyle === p.workStyle) score += 1;
    score += o.platforms.filter(x=>p.platforms.includes(x)).length;
    return {o, score};
  });
  scored.sort((a,b)=> b.score - a.score || PROFILES.indexOf(a.o) - PROFILES.indexOf(b.o));
  return scored.slice(0,n).map(s=>s.o);
}

/* ======================= RENDER: CARDS ======================= */
function renderCard(p){
  const chips = chipsRow([...p.itLikes, p.workStyle, ...p.platforms]);
  return (
    '<article class="card">'+
      '<a class="card__link" href="#/profile/'+p.slug+'">'+
        '<div class="card__top">'+
          '<img class="card__avatar" src="'+p.avatar+'" alt="Рисунок персонажа">'+
          '<div>'+
            '<div class="card__name">'+nameMarkup(p)+'</div>'+
            (p.nickname ? '<div class="card__nickname">«'+p.nickname+'»</div>' : '')+
            '<div class="card__position">'+p.position+'</div>'+
          '</div>'+
        '</div>'+
        renderConfidence(p.confidence,'sm')+
        '<div class="card__chips">'+chips+'</div>'+
        '<p class="card__quote">«'+p.fact+'»</p>'+
        '<span class="btn btn--blue btn--sm card__cta">Смотреть анкету</span>'+
      '</a>'+
    '</article>'
  );
}

function renderMiniCard(p){
  return (
    '<a class="mini-card" href="#/profile/'+p.slug+'">'+
      '<img src="'+p.avatar+'" alt="Рисунок персонажа">'+
      '<div>'+
        '<div class="mini-card__name">'+nameMarkup(p)+'</div>'+
        '<div class="mini-card__position">'+p.position+'</div>'+
      '</div>'+
    '</a>'
  );
}

/* ======================= RENDER: HOME ======================= */
function renderHome(){
  const total = PROFILES.length;
  const avgConf = (PROFILES.reduce((s,p)=>s+p.confidence,0) / total).toFixed(1).replace('.',',');
  const progCount = PROFILES.filter(p=>p.itLikes.includes('Программирование')).length;
  const tiktokCount = PROFILES.filter(p=>p.platforms.includes('TikTok')).length;

  return (
    '<section class="hero">'+
      '<div class="wrap hero__inner">'+
        '<h1>Всё уже в базе</h1>'+
        '<p class="hero__sub">14 анонимных профилей игроков — но анонимность продержалась недолго. '+
        'Узнайте, кто на самом деле сидит за соседней партой.</p>'+
        '<button type="button" class="btn btn--dark" id="scrollToCatalog">Смотреть анкеты</button>'+
      '</div>'+
    '</section>'+
    '<div class="wrap stats">'+
      '<div class="stat-card"><div class="stat-card__num">'+total+'</div><div class="stat-card__label">профилей в базе</div></div>'+
      '<div class="stat-card"><div class="stat-card__num">'+avgConf+' / 5</div><div class="stat-card__label">средняя уверенность в IT</div></div>'+
      '<div class="stat-card"><div class="stat-card__num">'+progCount+' из '+total+'</div><div class="stat-card__label">выбрали программирование</div></div>'+
      '<div class="stat-card"><div class="stat-card__num">'+tiktokCount+' из '+total+'</div><div class="stat-card__label">листают TikTok</div></div>'+
    '</div>'+
    '<section class="wrap catalog" id="catalog">'+
      '<div class="catalog__head">'+
        '<h2>Все анкеты</h2>'+
        '<p>Профиль игрока: рисунок персонажа плюс честные ответы про ИИ, работу и нишевые хобби.</p>'+
      '</div>'+
      '<div class="toolbar">'+
        '<div class="search-box">'+ICON_SEARCH+
          '<input type="text" id="search" placeholder="Найти по имени, хобби или факту">'+
        '</div>'+
        '<div class="pills">'+
          FILTERS.map(f=>'<button type="button" class="pill'+(state.filter===f.id?' pill--active':'')+'" data-filter="'+f.id+'">'+f.label+'</button>').join('')+
        '</div>'+
      '</div>'+
      '<div class="grid">'+renderGridInner()+'</div>'+
    '</section>'
  );
}

function renderGridInner(){
  const list = getFilteredProfiles();
  if (!list.length) return '<p class="empty">Никого не нашлось. Попробуйте другой запрос.</p>';
  return list.map(renderCard).join('');
}

function updateCatalog(){
  const grid = document.querySelector('.grid');
  if (grid) grid.innerHTML = renderGridInner();
  document.querySelectorAll('.pill').forEach(el=>{
    el.classList.toggle('pill--active', el.dataset.filter === state.filter);
  });
}

/* ======================= RENDER: PROFILE ======================= */
function renderProfile(slug){
  const p = findBySlug(slug);
  if (!p) return renderNotFound();
  const chips = chipsRow([...p.itLikes, ...p.learnLikes, p.workStyle, ...p.platforms]);
  const similar = pickSimilar(p, 3);

  return (
    '<div class="wrap profile">'+
      '<a class="back" href="#/">'+ICON_BACK+'Все анкеты</a>'+
      '<div class="profile-hero">'+
        '<img class="profile-hero__avatar" src="'+p.avatar+'" alt="Рисунок персонажа">'+
        '<div class="profile-hero__info">'+
          '<h1>'+nameMarkup(p)+'</h1>'+
          (p.nickname ? '<div class="profile-hero__nickname">«'+p.nickname+'»</div>' : '')+
          (p.flavorText ? '<div class="profile-hero__flavor">'+p.flavorText+'</div>' : '')+
          '<div class="profile-hero__position">'+p.position+'</div>'+
          '<div class="profile-hero__confidence">'+renderConfidence(p.confidence,'lg')+'</div>'+
          '<div class="profile-hero__chips">'+chips+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="section"><h2>Зачем использует ИИ</h2><p>'+p.aiUse+'</p></div>'+
      '<div class="section"><h2>Хочет создать</h2><p>'+p.dreamProduct+'</p></div>'+
      '<div class="section"><h2>Необычный навык или хобби</h2><p>'+p.hobby+'</p></div>'+
      '<div class="section"><h2>Неочевидный факт о себе</h2><p>'+p.fact+'</p></div>'+
      '<div class="similar">'+
        '<h2>Похожие анкеты</h2>'+
        '<div class="similar__grid">'+similar.map(renderMiniCard).join('')+'</div>'+
      '</div>'+
    '</div>'
  );
}

function renderNotFound(){
  return (
    '<div class="wrap not-found">'+
      '<h1>Такой анкеты нет</h1>'+
      '<p>Возможно, ссылка устарела.</p>'+
      '<a class="btn btn--dark" href="#/">Ко всем анкетам</a>'+
    '</div>'
  );
}

/* ======================= ROUTER ======================= */
function currentRoute(){
  const hash = location.hash || '';
  const m = hash.match(/^#\/profile\/([a-z0-9-]+)\/?$/);
  if (m) return {view:'profile', slug:m[1]};
  return {view:'home'};
}

function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  if (route.view === 'profile'){
    app.innerHTML = renderProfile(route.slug);
  } else {
    app.innerHTML = renderHome();
    const input = document.getElementById('search');
    if (input){
      input.value = state.query;
      input.addEventListener('input', function(e){
        state.query = e.target.value.toLowerCase();
        updateCatalog();
      });
    }
    const scrollBtn = document.getElementById('scrollToCatalog');
    if (scrollBtn){
      scrollBtn.addEventListener('click', function(){
        document.getElementById('catalog').scrollIntoView({behavior:'smooth'});
      });
    }
  }
  window.scrollTo(0,0);
  const toggle = document.getElementById('guessToggle');
  if (toggle) toggle.checked = state.guessMode;
}

window.addEventListener('hashchange', render);

/* ======================= GLOBAL EVENTS ======================= */
document.addEventListener('click', function(e){
  const revealBtn = e.target.closest('[data-reveal]');
  if (revealBtn){
    e.preventDefault();
    e.stopPropagation();
    const slug = revealBtn.dataset.reveal;
    state.revealed.add(slug);
    persist();
    const p = findBySlug(slug);
    document.querySelectorAll('[data-reveal="'+slug+'"]').forEach(function(el){
      el.outerHTML = '<span class="name-text">'+fullName(p)+'</span>';
    });
    return;
  }
  const pill = e.target.closest('.pill');
  if (pill){
    state.filter = pill.dataset.filter;
    updateCatalog();
    return;
  }
});

document.addEventListener('change', function(e){
  if (e.target.id === 'guessToggle'){
    state.guessMode = e.target.checked;
    persist();
    render();
  }
});

render();
</script>
</body>
</html>
